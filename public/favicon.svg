<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Sharp Brutalist Drop Shadow Filter -->
    <filter id="brutalist-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="4" dy="4" stdDeviation="0" flood-color="#000000" flood-opacity="1"/>
    </filter>
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
  </defs>

  <!-- Background Base Container -->
  <rect x="8" y="8" width="112" height="112" rx="24" fill="#FAF9F6" stroke="#000000" stroke-width="6" filter="url(#brutalist-shadow)"/>

  <!-- Document / Fold Corner Sheet -->
  <path d="M 30 26 L 82 26 L 98 42 L 98 102 L 30 102 Z" fill="#FFFFFF" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Fold corner accent -->
  <path d="M 82 26 L 82 42 L 98 42 Z" fill="#F59E0B" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>

  <!-- Graduation Cap / Scholar Accent Top Left -->
  <circle cx="40" cy="38" r="5" fill="#2563EB" stroke="#000000" stroke-width="2"/>

  <!-- Stylized "PYQ" Neo-Brutalist Monogram -->
  <text x="64" y="74" 
        font-family="system-ui, -apple-system, 'Space Grotesk', BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-weight="900" 
        font-size="28" 
        text-anchor="middle" 
        fill="#000000" 
        letter-spacing="-1">
    PYQ
  </text>

  <!-- Sub-label "BPUT" Accent Pill -->
  <rect x="42" y="84" width="44" height="12" rx="6" fill="#F59E0B" stroke="#000000" stroke-width="2.5"/>
  <text x="64" y="93" 
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
        font-weight="900" 
        font-size="8.5" 
        text-anchor="middle" 
        fill="#000000" 
        letter-spacing="1">
    BPUT
  </text>
</svg>
